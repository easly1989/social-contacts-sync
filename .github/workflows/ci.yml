name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # whatsapp-web.js pulls in Puppeteer; none of these jobs drive WhatsApp.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  web:
    name: Web and end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/e2e/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: web/e2e/.results/

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci && npm run build
        working-directory: server
      - run: npm ci && npx vite build
        working-directory: web
      - run: .github/scripts/smoke-test.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci && npm run build
        working-directory: server
      - run: npm ci && npx vite build
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - name: Unit tests
        run: npm test && npm run typecheck:e2e
        working-directory: desktop
      - name: Package (unpacked Linux build)
        run: node scripts/stage.mjs --no-build && npx electron-builder --config electron-builder.config.js --linux dir --publish never
        working-directory: desktop
      - name: Launch the packaged app
        run: xvfb-run -a npm run test:e2e
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: desktop/e2e/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-traces
          path: desktop/e2e/.results/

  workflow-scripts:
    name: Workflow scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck .github/scripts/*.sh
      - run: .github/scripts/upstream-sync.test.sh

  # Publishes the e2e screenshots next to the PR so UI changes can be reviewed
  # without checking the branch out. Only for branches of this repository:
  # pull requests from forks get a read-only token.
  screenshots:
    name: PR screenshots
    needs: [web, desktop]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          pattern: "*-screenshots"
          merge-multiple: true
          path: screenshots
      - name: Publish and comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/publish-screenshots.sh screenshots
