name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-scripts:
    name: Workflow scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck .github/scripts/*.sh
      - run: .github/scripts/upstream-sync.test.sh
